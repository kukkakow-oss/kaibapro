# Builds the modified YGOPro.exe (Bot Theater) for Windows on GitHub's computers,
# using Kaiba Corporation's rules engine (kaibapro-core).
# Sound uses miniaudio (irrKlang, the original sound library, is no longer available).
# Runs automatically after every change, or by hand from the Actions tab.
name: Build Bot Theater

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: true

    - name: Switch to Kaiba's rules engine
      run: |
        cd ocgcore
        # Pinned to the exact engine version Bot Theater's engine changes were made against.
        git fetch --depth=1 https://github.com/Kaiba-Corporation/kaibapro-core.git d57ca355d1be3773a5c224e0f7072040691f613c
        git checkout -f FETCH_HEAD
        cd ..

    - name: Apply Bot Theater's rules engine changes
      run: |
        # Modified engine files (split-zone tag rule) kept in the bot_theater_core folder.
        Copy-Item -Path bot_theater_core\* -Destination ocgcore -Force
        Get-ChildItem bot_theater_core | ForEach-Object { Write-Output "Replaced ocgcore\$($_.Name)" }

    - name: Show which rules engine version is used
      run: |
        cd ocgcore
        git log -1 --format="%H  %ci  %s"
        if (!(Test-Path premake5.lua)) { Write-Error "This engine version has no premake5.lua build file."; exit 1 }
        cd ..

    - name: Download premake
      id: premake
      uses: mercury233/action-cache-download-file@v1.0.0
      with:
        url: https://github.com/premake/premake-core/releases/download/v5.0.0-beta5/premake-5.0.0-beta5-windows.zip
        filename: premake5.zip

    - name: Extract premake
      run: |
        7z x ${{ steps.premake.outputs.filepath }}

    - name: Download libevent
      id: libevent
      uses: mercury233/action-cache-download-file@v1.0.0
      with:
        url: https://github.com/libevent/libevent/releases/download/release-2.0.22-stable/libevent-2.0.22-stable.tar.gz
        filename: libevent.tar.gz

    - name: Extract libevent
      run: |
        tar xf ${{ steps.libevent.outputs.filepath }}
        move libevent-2.0.22-stable event
        xcopy /E event\WIN32-Code event\include

    - name: Download freetype
      id: freetype
      uses: mercury233/action-cache-download-file@v1.0.0
      with:
        url: http://downloads.sourceforge.net/freetype/freetype-2.13.3.tar.gz

    - name: Extract freetype
      run: |
        tar xf ${{ steps.freetype.outputs.filepath }}
        move freetype-2.13.3 freetype

    - name: Download lua
      id: lua
      uses: mercury233/action-cache-download-file@v1.0.0
      with:
        url: https://www.lua.org/ftp/lua-5.4.7.tar.gz

    - name: Extract lua
      run: |
        tar xf ${{ steps.lua.outputs.filepath }}
        move lua-5.4.7 lua

    - name: Download sqlite
      id: sqlite
      uses: mercury233/action-cache-download-file@v1.0.0
      with:
        url: https://www.sqlite.org/2025/sqlite-amalgamation-3490100.zip

    - name: Extract sqlite
      run: |
        7z x ${{ steps.sqlite.outputs.filepath }}
        move sqlite-amalgamation-3490100 sqlite3

    # irrKlang (the original sound library) is no longer publicly downloadable,
    # so the game is built with miniaudio for sound instead.
    - name: Download miniaudio
      run: |
        git clone --depth=1 --branch 0.11.21 https://github.com/mackron/miniaudio.git miniaudio

    - name: Download irrlicht
      run: |
        # The game's code expects the older (1.8-based) version of this Irrlicht
        # copy; newer versions are 1.9-based. Search the history for the newest
        # version whose button code matches what the game expects.
        git clone https://github.com/mercury233/irrlicht
        cd irrlicht
        $pattern = 'bool\s+loop\s*=\s*false\s*\)\s*=\s*0'
        $found = $null
        foreach ($list in @('--first-parent HEAD', '--all')) {
          foreach ($c in (git rev-list $list.Split(' '))) {
            $button = (git show "${c}:include/IGUIButton.h" 2>$null) -join "`n"
            $types = (git show "${c}:include/irrTypes.h" 2>$null) -join "`n"
            if ($button -match $pattern -and $types -match '_IRR_DEBUG_BREAK_IF') { $found = $c; break }
          }
          if ($found) { break }
        }
        if (-not $found) { Write-Error "No matching Irrlicht version found."; exit 1 }
        git checkout $found
        git log -1 --format="Using Irrlicht version: %H  %ci  %s"
        cd ..

    - name: Build SFML (network part only)
      run: |
        # TDOANE's version of the game uses SFML's network module to download
        # online avatars and card sleeves. Build it as a static library so the
        # finished exe doesn't depend on any extra DLL versions.
        git clone --depth=1 --branch 2.6.2 https://github.com/SFML/SFML.git sfml-src
        cmake -S sfml-src -B sfml-build -G "Visual Studio 17 2022" -A Win32 `
          -DBUILD_SHARED_LIBS=OFF -DSFML_USE_STATIC_STD_LIBS=ON `
          -DSFML_BUILD_WINDOW=OFF -DSFML_BUILD_GRAPHICS=OFF -DSFML_BUILD_AUDIO=OFF `
          -DSFML_BUILD_NETWORK=ON -DSFML_BUILD_EXAMPLES=OFF -DSFML_BUILD_DOC=OFF `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/sfml"
        cmake --build sfml-build --config Release --target install

    - name: Check DirectX SDK
      id: dxsdk
      uses: actions/cache@v4
      with:
        key: dxsdk
        path: DXSDK

    - name: Download DirectX SDK
      if: steps.dxsdk.outputs.cache-hit != 'true'
      id: dxsdk-download
      uses: mercury233/action-cache-download-file@v1.0.0
      with:
        url: https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe

    - name: Install DirectX SDK
      if: steps.dxsdk.outputs.cache-hit != 'true'
      run: |
        7z x ${{ steps.dxsdk-download.outputs.filepath }} -aoa

    - name: Set DirectX SDK environment variable
      run: |
        $dxsdkPath = Resolve-Path 'DXSDK'
        "DXSDK_DIR=$($dxsdkPath.ProviderPath)\" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Copy premake files
      run: |
        xcopy /E premake\* .
        xcopy /E resource\* .

    - name: Add SFML and miniaudio to the game's build
      run: |
        Add-Content gframe/premake5.lua @'

        project "YGOPro"
            filter {}
            includedirs { "../sfml/include", "../miniaudio" }
            libdirs { "../sfml/lib" }
            defines { "SFML_STATIC", "YGOPRO_USE_MINIAUDIO" }
            links { "sfml-network-s", "sfml-system-s", "ws2_32", "winmm" }
            files { "miniaudio_impl.c" }
        '@

    - name: Use premake to generate Visual Studio solution (2022)
      run: |
        .\premake5.exe vs2022 --no-use-irrklang

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build solution
      run: |
        MSBuild.exe build\YGOPro.sln /m /p:Configuration=Release

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: YGOPro-BotTheater
        path: |
          bin/release/YGOPro.exe
